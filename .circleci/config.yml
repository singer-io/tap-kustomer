version: 2
jobs:
  build:
    docker:
      - image: 218546966473.dkr.ecr.us-east-1.amazonaws.com/circle-ci:stitch-tap-tester-uv
    steps:
      - checkout
      - run:
          name: 'Setup virtual env'
          command: |
            uv venv --python 3.12 /usr/local/share/virtualenvs/tap-kustomer
            source /usr/local/share/virtualenvs/tap-kustomer/bin/activate
            uv pip install -U setuptools
            uv pip install -e .[dev]
      - run:
          name: 'pylint'
          command: |
            source /usr/local/share/virtualenvs/tap-kustomer/bin/activate
            pylint tap_kustomer -d C,R,W
      - run:
          name: 'Unit Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-kustomer/bin/activate
            mkdir -p test_output
            pytest --cov=tap_kustomer --cov-report=term-missing --junitxml=test_output/report.xml tests/unittests
            coverage html
          when: always
      - store_test_results:
          path: test_output
      - store_artifacts:
          path: htmlcov
      - run:
          name: 'Mocked Integration Tests'
          command: |
            source /usr/local/share/virtualenvs/tap-kustomer/bin/activate
            pytest tests/mockedtests -v
